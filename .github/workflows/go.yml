name: Go
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x']
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is stamped from git describe, so the build needs the
          # tags and not just the tip.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # setup-go caches the module and build caches by default; the key
          # comes from go.sum.
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted" >&2
            echo "run: gofmt -w ." >&2
            exit 1
          fi
      - run: go vet ./...
      - name: test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        if: matrix.go == '1.26.x'
        with:
          name: coverage
          path: coverage.out
      - name: fuzz seeds
        # The seed corpus runs with the normal tests; this is a short fuzzing
        # pass over the parsers of untrusted hardware output.
        run: |
          for target in FuzzParseVPD80 FuzzParseTemperature FuzzParseFanSpeed FuzzParseLsscsi; do
            go test -run xxx -fuzz "$target" -fuzztime 30s ./internal/jbod/
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: jbod-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: build the .deb
        run: make deb
      - name: inspect the .deb
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
